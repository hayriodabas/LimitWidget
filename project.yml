name: LimitWidget
options:
  bundleIdPrefix: com.hayriodabas
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "27.2"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  LimitWidget:
    type: application
    platform: macOS
    sources:
      - path: LimitWidgetApp
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    dependencies:
      - target: LimitWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hayriodabas.LimitWidget
        INFOPLIST_FILE: LimitWidgetApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: LimitWidgetApp/LimitWidget.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: YES

  LimitWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: LimitWidgetExtension
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hayriodabas.LimitWidget.Widget
        INFOPLIST_FILE: LimitWidgetExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: LimitWidgetExtension/LimitWidgetExtension.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"

  LimitWidgetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LimitWidgetTests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hayriodabas.LimitWidgetTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LimitWidget:
    build:
      targets:
        LimitWidget: all
        LimitWidgetExtension: all
        LimitWidgetTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LimitWidgetTests
